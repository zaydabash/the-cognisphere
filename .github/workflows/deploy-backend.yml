name: Deploy Backend (Render)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Render configuration
        id: check
        run: |
          if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Render secrets are not set; skipping backend deploy."
            echo "Add RENDER_API_KEY, RENDER_SERVICE_ID and RENDER_HEALTH_URL to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deployment
        if: steps.check.outputs.configured == 'true'
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}

      - name: Health check
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "Waiting for the Render deployment to become healthy..."
          for i in {1..20}; do
            echo "Attempt $i of 20"
            if curl -f -s --max-time 30 "${{ secrets.RENDER_HEALTH_URL }}/healthz" > /dev/null; then
              echo "Health check passed. Backend is live at ${{ secrets.RENDER_HEALTH_URL }}"
              exit 0
            fi
            sleep 15
          done
          echo "Health check did not pass after 20 attempts."
          exit 1
