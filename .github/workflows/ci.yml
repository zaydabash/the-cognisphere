name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting (black)
        working-directory: backend
        run: python -m black --line-length=100 --check .

      - name: Check import order (isort)
        working-directory: backend
        run: python -m isort --profile=black --line-length=100 --check-only .

      - name: Lint (flake8)
        working-directory: backend
        run: python -m flake8 --config=.flake8 .

      - name: Type-check (mypy)
        working-directory: backend
        run: python -m mypy .

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with coverage
        working-directory: backend
        run: python -m pytest

      - name: Smoke test the simulation
        run: python scripts/seed_and_run.py --preset lab --ticks 10 --seed 42

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run type-check

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
