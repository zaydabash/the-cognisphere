[mypy]
python_version = 3.11
# Third-party libraries (feedparser, textblob, faiss, neo4j, networkx, ...)
# ship without type stubs; don't fail on their missing types.
ignore_missing_imports = True
# Pragmatic settings for an existing, gradually-typed codebase.
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_optional = True
show_error_codes = True

# Tests are exercised by pytest, not type-checked here.
[mypy-tests.*]
ignore_errors = True
